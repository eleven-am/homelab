apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: usesend-secret
  namespace: usesend
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /usesend
  targets:
    - name: usesend-secret
      namespace: usesend
      kind: Secret
      creationPolicy: Owner
