apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: coturn-secret
  namespace: vox
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /vox
  targets:
    - name: coturn-secret
      namespace: vox
      kind: Secret
      creationPolicy: Owner
