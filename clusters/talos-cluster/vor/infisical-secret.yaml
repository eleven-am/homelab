apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: vor-secrets
  namespace: vor
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /vor
  targets:
    - name: vor-secrets
      namespace: vor
      kind: Secret
      creationPolicy: Owner
