apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vor-route
  namespace: vor
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
  hostnames:
    - "vor.horus.maix.ovh"
  rules:
    - timeouts:
        request: 660s
        backendRequest: 660s
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vor
          port: 80
