apiVersion: apps/v1
kind: Deployment
metadata:
  name: vor
  namespace: vor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vor
  template:
    metadata:
      labels:
        app: vor
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vor
          image: zot.maix.ovh/vor:v0.0.14@sha256:c35f4069aa2c31c6b6e14da50efebcfaf2dc29beb4f21f6bc0adf5c523945e87
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: SEARXNG_COMPAT_TIMEOUT
              value: "9s"
            - name: DATABASE_PATH
              value: "/data/vor.db"
            - name: USAGE_RETENTION
              value: "2160h"
            - name: BOOTSTRAP_SERVICE_NAME
              value: "legacy-gateway"
            - name: BOOTSTRAP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vor-secrets
                  key: GATEWAY_API_KEY
            - name: ADMIN_MASTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vor-secrets
                  key: ADMIN_MASTER_API_KEY
            - name: SEARXNG_URL
              value: "http://searxng.searxng.svc.cluster.local:8080"
            - name: LITELLM_URL
              value: "http://litellm-service.litellm.svc.cluster.local:4000"
            - name: RERANK_MODEL
              value: "osiris/rerank-pro"
            - name: SEARXNG_TIMEOUT
              value: "15s"
            - name: MIMIR_URL
              value: "http://mimir-service.mimir.svc.cluster.local:3000"
            - name: MIMIR_TIMEOUT
              value: "10m"
            - name: LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  name: vor-secrets
                  key: LITELLM_KEY
            - name: MIMIR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vor-secrets
                  key: MIMIR_API_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      imagePullSecrets:
        - name: zot-pull-secret
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vor-data
