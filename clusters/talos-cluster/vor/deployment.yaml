apiVersion: apps/v1
kind: Deployment
metadata:
  name: vor
  namespace: vor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vor
  template:
    metadata:
      labels:
        app: vor
    spec:
      containers:
        - name: vor
          image: zot.maix.ovh/vor:v0.0.1@sha256:45553c8291e973872cffeec3926cc78bd0c88dcc570e2e1e55a640e8ff2f7e64
          imagePullPolicy: Always
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: SEARXNG_URL
              value: "http://searxng.searxng.svc.cluster.local:8080"
            - name: LITELLM_URL
              value: "http://litellm-service.litellm.svc.cluster.local:4000"
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vor-secrets
                  key: GATEWAY_API_KEY
            - name: LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  name: vor-secrets
                  key: LITELLM_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      imagePullSecrets:
        - name: zot-pull-secret
