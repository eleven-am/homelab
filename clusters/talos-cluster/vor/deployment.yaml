apiVersion: apps/v1
kind: Deployment
metadata:
  name: vor
  namespace: vor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vor
  template:
    metadata:
      labels:
        app: vor
    spec:
      containers:
        - name: vor
          image: zot.maix.ovh/vor:v0.0.6@sha256:66086c57b2c90d290f7657c90e2eb0962960898a87347ca3d3b11e7902c96b2e
          imagePullPolicy: Always
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: SEARXNG_URL
              value: "http://searxng.searxng.svc.cluster.local:8080"
            - name: LITELLM_URL
              value: "http://litellm-service.litellm.svc.cluster.local:4000"
            - name: RERANK_MODEL
              value: "osiris/rerank-pro"
            - name: SEARXNG_TIMEOUT
              value: "15s"
            - name: MIMIR_URL
              value: "http://mimir-service.mimir.svc.cluster.local:3000"
            - name: MIMIR_TIMEOUT
              value: "10m"
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vor-secrets
                  key: GATEWAY_API_KEY
            - name: LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  name: vor-secrets
                  key: LITELLM_KEY
            - name: MIMIR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vor-secrets
                  key: MIMIR_API_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      imagePullSecrets:
        - name: zot-pull-secret
