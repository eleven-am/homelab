apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: mimir-secret
  namespace: mimir
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /mimir
  targets:
    - name: mimir-secret
      namespace: mimir
      kind: Secret
      creationPolicy: Owner
