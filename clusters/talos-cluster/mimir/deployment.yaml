apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir-deployment
  namespace: mimir
  labels:
    app: mimir
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 997
        runAsGroup: 997
        fsGroup: 997
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mimir
          image: zot.maix.ovh/mimir:v0.0.90@sha256:bf2083dc0b31fab02e673072c7db031879a234675b04030c9f009cf06bd12b2c
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: MIMIR_DATABASE_URL
              value: "sqlite:///data/mimir.db"
            - name: MIMIR_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mimir-secret
                  key: MIMIR_ADMIN_API_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shared-memory
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data-v2
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
      imagePullSecrets:
        - name: zot-pull-secret
