apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir-deployment
  namespace: mimir
  labels:
    app: mimir
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      securityContext:
        fsGroup: 997
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mimir
          image: zot.maix.ovh/mimir:v0.0.56@sha256:5b5e699adb4ab75a5b5f33fb17e6196c1741276041b9ac5abfc87cc113b26cde
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: MIMIR_DATABASE_URL
              value: "sqlite:///data/mimir.db"
            - name: MIMIR_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mimir-secret
                  key: MIMIR_ADMIN_API_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data-v2
      imagePullSecrets:
        - name: zot-pull-secret
