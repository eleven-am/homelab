apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data-v2
  namespace: mimir
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: app-storage
  resources:
    requests:
      # Mimir enforces 1 GiB per browser profile and an 8 GiB aggregate
      # browser-profile budget. Keep separate space for SQLite, WAL files,
      # atomic profile quarantine and cleanup.
      storage: 12Gi
