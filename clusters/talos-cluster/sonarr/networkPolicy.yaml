apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sonarr-ingress
  namespace: sonarr
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prowlarr
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cleanuparr
