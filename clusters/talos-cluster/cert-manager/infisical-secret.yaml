apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: cloudflare-api-token
  namespace: gateway
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "cloudflare-gateway"
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /cloudflare/api-token
  targets:
    - name: cloudflare-api-token
      namespace: gateway
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          api-token: "{{ .API_TOKEN.Value }}"
