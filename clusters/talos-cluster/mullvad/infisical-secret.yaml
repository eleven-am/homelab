apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: mullvad-secret
  namespace: mullvad
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /mullvad
  targets:
    - name: mullvad-secret
      namespace: mullvad
      kind: Secret
      creationPolicy: Owner
