apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: cloudflare
  namespace: cloudflare-gateway
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /cloudflare/gateway
  targets:
    - name: cloudflare
      namespace: cloudflare-gateway
      kind: Secret
      creationPolicy: Owner
