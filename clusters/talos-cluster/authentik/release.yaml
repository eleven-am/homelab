apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: authentik
      version: "2026.8.3"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  values:
    global:
      image:
        repository: ghcr.io/goauthentik/server
        tag: "2026.8.3"
        digest: "sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849"
      env:
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: postgres-service.postgres.svc.cluster.local
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: authentik
    authentik:
      existingSecret:
        secretName: authentik-secret
      error_reporting:
        enabled: false
    postgresql:
      enabled: false
    server:
      replicas: 1
      resources:
        requests:
          memory: 512Mi
          cpu: 100m
        limits:
          memory: 1Gi
    worker:
      replicas: 1
      resources:
        requests:
          memory: 512Mi
          cpu: 100m
        limits:
          memory: 1Gi
