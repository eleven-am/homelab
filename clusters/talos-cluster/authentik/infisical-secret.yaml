apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: authentik-secret
  namespace: authentik
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /authentik
  targets:
    - name: authentik-secret
      namespace: authentik
      kind: Secret
      creationPolicy: Owner
