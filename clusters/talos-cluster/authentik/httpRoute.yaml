apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-horus-route
  namespace: authentik
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
  hostnames:
    - "auth.horus.maix.ovh"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-cloudflare-route
  namespace: authentik
spec:
  parentRefs:
    - name: cloudflare-gateway
      namespace: cloudflare-gateway
  hostnames:
    - "auth.maix.ovh"
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: ^/application/o/
        - path:
            type: RegularExpression
            value: ^/if/flow/
        - path:
            type: RegularExpression
            value: ^/flows/
        - path:
            type: RegularExpression
            value: ^/api/v3/flows/executor/
        - path:
            type: RegularExpression
            value: ^/api/v3/root/config/
        - path:
            type: RegularExpression
            value: ^/api/v3/core/brands/current/
        - path:
            type: RegularExpression
            value: ^/source/oauth/
        - path:
            type: RegularExpression
            value: ^/static/
        - path:
            type: RegularExpression
            value: ^/media/
      backendRefs:
        - name: authentik-server
          port: 80
