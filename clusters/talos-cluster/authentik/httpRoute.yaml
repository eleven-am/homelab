apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-horus-route
  namespace: authentik
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
  hostnames:
    - "auth.horus.maix.ovh"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          port: 80
