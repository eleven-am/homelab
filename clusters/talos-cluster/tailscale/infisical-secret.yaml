apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: sops-operator-oauth
  namespace: tailscale
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /tailscale/operator-oauth
  targets:
    - name: sops-operator-oauth
      namespace: tailscale
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          client_id: "{{ .CLIENT_ID.Value }}"
          client_secret: "{{ .CLIENT_SECRET.Value }}"
