apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: frames-secret
  namespace: frames
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /frames
  targets:
    - name: frames-secret
      namespace: frames
      kind: Secret
      creationPolicy: Owner
