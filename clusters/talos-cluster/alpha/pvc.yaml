apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alpha-data
  namespace: alpha
spec:
  storageClassName: blizzard-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alpha-media
  namespace: alpha
spec:
  storageClassName: media-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
