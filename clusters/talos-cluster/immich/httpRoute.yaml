apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-horus-route
  namespace: immich
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
  hostnames:
    - "immich.horus.maix.ovh"
  rules:
    - timeouts:
        request: "0s"
        backendRequest: "0s"
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: immich-server
          port: 2283
