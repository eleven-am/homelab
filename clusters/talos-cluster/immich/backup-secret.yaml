apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: immich-backup
  namespace: immich
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /immich-backup
  targets:
    - name: immich-backup
      namespace: immich
      kind: Secret
      creationPolicy: Owner
