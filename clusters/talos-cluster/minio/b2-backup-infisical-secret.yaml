apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: b2-backup-secret
  namespace: minio
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /minio/b2-backup
  targets:
    - name: b2-backup-secret
      namespace: minio
      kind: Secret
      creationPolicy: Owner
