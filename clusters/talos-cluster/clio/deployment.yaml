apiVersion: apps/v1
kind: Deployment
metadata:
  name: clio
  namespace: clio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clio
  template:
    metadata:
      labels:
        app: clio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clio
          image: zot.maix.ovh/clio:20260906-221813
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_USERNAME
              value: "eleven-am"
            - name: APP_ORIGIN
              value: "https://clio.horus.maix.ovh"
            - name: LISTEN_ADDR
              value: ":8080"
            - name: DATABASE_PATH
              value: "/data/naturalisation.db"
            - name: WEB_DIR
              value: "/app/web"
            - name: VOX_HTTP_BASE
              value: "http://vox-service.vox.svc.cluster.local:11435"
            - name: VOX_STT_MODEL
              value: "parakeet-stt:tdt-0.6b-v3"
            - name: VOX_TTS_MODEL
              value: "kokoro-tts:v1.0"
            - name: VOX_VOICE
              value: "af_heart"
            - name: LITELLM_BASE_URL
              value: "http://litellm-service.litellm.svc.cluster.local:4000/v1"
            - name: LLM_MODEL
              value: "osiris/foundation"
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clio-secrets
                  key: APP_PASSWORD
            - name: VOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clio-secrets
                  key: VOX_API_KEY
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clio-secrets
                  key: LITELLM_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clio-data
        - name: tmp
          emptyDir: {}
      imagePullSecrets:
        - name: zot-pull-secret
