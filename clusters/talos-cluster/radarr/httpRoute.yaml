apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr-route
  namespace: radarr
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
  hostnames:
    - "radarr.horus.maix.ovh"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Forwarded-For
              - X-Real-IP
      backendRefs:
        - name: radarr-service
          port: 7878
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr-api-route
  namespace: radarr
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
  hostnames:
    - "radarr.horus.maix.ovh"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /feed
      backendRefs:
        - name: radarr-service
          port: 7878
