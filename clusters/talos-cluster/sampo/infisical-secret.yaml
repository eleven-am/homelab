apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: sampo-secret
  namespace: sampo
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /sampo
  targets:
    - name: sampo-secret
      namespace: sampo
      kind: Secret
      creationPolicy: Owner
