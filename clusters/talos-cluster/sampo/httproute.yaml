apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sampo-cloudflare-route
  namespace: sampo
spec:
  parentRefs:
    - name: cloudflare-gateway
      namespace: cloudflare-gateway
  hostnames:
    - "sampo.maix.ovh"
    - "sampo-content.maix.ovh"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sampo-service
          port: 80
