apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sampo-ingress
  namespace: sampo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-gateway
      ports:
        - protocol: TCP
          port: 8080
