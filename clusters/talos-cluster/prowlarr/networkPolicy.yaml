apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prowlarr-ingress
  namespace: prowlarr
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sonarr
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: radarr
      ports:
        - protocol: TCP
          port: 9696
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mimir
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: searxng
      ports:
        - protocol: TCP
          port: 8191
