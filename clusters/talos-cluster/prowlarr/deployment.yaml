apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr-deployment
  namespace: prowlarr
  labels:
    app: prowlarr-deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
  selector:
    matchLabels:
      app: prowlarr-deployment
  template:
    metadata:
      name: prowlarr-deployment
      labels:
        app: prowlarr-deployment
    spec:
      restartPolicy: Always
      containers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
          imagePullPolicy: Always
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
          env:
            - name: TZ
              value: "Europe/Paris"
            - name: VPN_SERVICE_PROVIDER
              value: "mullvad"
            - name: VPN_TYPE
              value: "wireguard"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr-secret
                  key: WIREGUARD_PRIVATE_KEY
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: prowlarr-secret
                  key: WIREGUARD_ADDRESSES
            - name: SERVER_CITIES
              value: "Paris"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.0.0.0/8,172.198.1.0/24,192.168.101.0/24"
            - name: FIREWALL_INPUT_PORTS
              value: "9696,8191"
            - name: PUBLICIP_FILE
              value: "/gluetun/ip"
          resources:
            limits:
              devic.es/tun: "1"
          volumeMounts:
            - name: gluetun-config
              mountPath: /gluetun
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.5.2@sha256:2f3d31307beba3ba2dd226d191f5f5c14ee3b4d8b49277c64683f5ed97083179
          imagePullPolicy: Always
          ports:
            - containerPort: 9696
              name: prowlarr
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Paris"
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config
            - name: prowlarr-media
              mountPath: /media
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "3Gi"
              cpu: "1000m"
          env:
            - name: LOG_LEVEL
              value: "debug"
            - name: LOG_HTML
              value: "false"
            - name: CAPTCHA_SOLVER
              value: "hcaptcha"
            - name: TZ
              value: "Europe/Paris"
          ports:
            - containerPort: 8191
      volumes:
        - name: gluetun-config
          persistentVolumeClaim:
            claimName: gluetun-data
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-data
        - name: prowlarr-media
          persistentVolumeClaim:
            claimName: prowlarr-media
