apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: horus-gateway-oidc
  namespace: prowlarr
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /horus-gateway-oidc
  targets:
    - name: horus-gateway-oidc
      namespace: prowlarr
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          client-secret: "{{ .CLIENT_SECRET.Value }}"
