apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: prowlarr-secret
  namespace: prowlarr
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /prowlarr
  targets:
    - name: prowlarr-secret
      namespace: prowlarr
      kind: Secret
      creationPolicy: Owner
