apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferret
  namespace: ferret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ferret
  template:
    metadata:
      labels:
        app: ferret
    spec:
      containers:
        - name: ferret
          image: zot.maix.ovh/ferret:v0.7.2@sha256:47b29b7c7020021604256d83e578e169a4de201daab0639f612b7b84fc380c80
          imagePullPolicy: Always
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          ports:
            - name: http
              containerPort: 4100
          env:
            - name: FERRET_PORT
              value: "4100"
            - name: FERRET_DB_PATH
              value: "/data/ferret.db"
            - name: FERRET_BASE_URL
              value: "https://ferret.maix.ovh"
            - name: FERRET_TRUSTED_ORIGINS
              value: "https://ferret.maix.ovh"
            - name: FERRET_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferret-secrets
                  key: BETTER_AUTH_SECRET
            - name: FERRET_JOBS_CONCURRENCY
              value: "2"
            - name: FERRET_LLM_CONCURRENCY
              value: "8"
            - name: FERRET_SETUP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferret-secrets
                  key: FERRET_SETUP_SECRET
            - name: FERRET_TRUST_PROXY_HOPS
              value: "1"
          volumeMounts:
            - name: ferret-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: ferret-data
          persistentVolumeClaim:
            claimName: ferret-data
      imagePullSecrets:
        - name: zot-pull-secret
