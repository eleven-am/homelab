apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: ferret-secrets
  namespace: ferret
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /ferret
  targets:
    - name: ferret-secrets
      namespace: ferret
      kind: Secret
      creationPolicy: Owner
