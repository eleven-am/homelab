apiVersion: v1
kind: ConfigMap
metadata:
  name: readable-v4-config
  namespace: readable
data:
  GOLEM_HTTP_ADDRESS: ":8080"
  GOLEM_DATABASE_DSN: "file:/data/readable.sqlite"
  STORAGE_DIR: "/data/storage"
  LOG_FORMAT: "json"
  LOG_LEVEL: "info"
  JOBS_WORKERS: "4"
  AUTH_COOKIE_SECURE: "true"
  TRUSTED_ORIGINS: "https://readable.maix.ovh"
  MIMIR_URL: "http://mimir-service.mimir.svc.cluster.local:3000"
  LITELLM_URL: "http://litellm-service.litellm.svc.cluster.local:4000"
  READABLE_CONTENT_MODEL: "osiris/foundation"
  READABLE_PREAMBLE_MODEL: "osiris/foundation"
  READABLE_CHAT_MODEL: "osiris/foundation"
  READABLE_EMBEDDING_MODEL: "osiris/embedding"
  ROLEPLAY_EMBEDDING_DIMENSION: "1024"
  BROWSERLESS_URL: "http://browserless-service.browserless.svc.cluster.local:3000"
  VOX_URL: "http://vox-service.vox.svc.cluster.local:11435"
  VOX_STT_MODEL: "parakeet-stt:tdt-0.6b-v3"
  VOX_TTS_MODEL: "kokoro-tts:v1.0"
  VOX_VOICE: "af_heart"
  ROLEPLAY_DEFAULT_VOICE: "af_heart"
  VOX_TURN_PROFILE: "browser_default"
  VOX_VAD_BACKEND: "silero"
  VOX_TURN_DETECTOR: "livekit"
