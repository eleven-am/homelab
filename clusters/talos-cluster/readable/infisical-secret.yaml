apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: readable-secret
  namespace: readable
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /readable
  targets:
    - name: readable-secret
      namespace: readable
      kind: Secret
      creationPolicy: Owner
