apiVersion: apps/v1
kind: Deployment
metadata:
  name: readable
  namespace: readable
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: readable
  template:
    metadata:
      labels:
        app: readable
    spec:
      imagePullSecrets:
        - name: zot-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: readable
          image: zot.maix.ovh/readable:v0.0.56@sha256:5aaf80b2d24f3d3797e5a759ac78fcf27618bac70fb31f23509f31628a5dc7e7
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GOLEM_HTTP_ADDRESS
              value: ":8080"
            - name: GOLEM_DATABASE_DSN
              value: "file:/data/readable.sqlite"
            - name: GOLEM_SQLITE_DURABILITY
              value: "network-filesystem"
            - name: STORAGE_DIR
              value: "/data/storage"
            - name: AUTH_COOKIE_SECURE
              value: "true"
            - name: TRUSTED_ORIGINS
              value: "https://readable.maix.ovh"
            - name: AUTHENTIK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_ISSUER
            - name: AUTHENTIK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_CLIENT_ID
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_CLIENT_SECRET
            - name: AUTHENTIK_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_REDIRECT_URL
            - name: AUTHENTIK_POST_LOGOUT_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_POST_LOGOUT_REDIRECT_URL
            - name: MIMIR_URL
              value: "http://mimir-service.mimir.svc.cluster.local:3000"
            - name: MIMIR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: MIMIR_API_KEY
            - name: LITELLM_URL
              value: "http://litellm-service.litellm.svc.cluster.local:4000"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: LITELLM_API_KEY
            - name: READABLE_CONTENT_MODEL
              value: "osiris/foundation"
            - name: READABLE_PREAMBLE_MODEL
              value: "osiris/foundation"
            - name: READABLE_CHAT_MODEL
              value: "osiris/foundation"
            - name: READABLE_VISION_MODEL
              value: "osiris/foundation"
            - name: READABLE_EMBEDDING_MODEL
              value: "osiris/embedding"
            - name: BROWSERLESS_URL
              value: "http://browserless-service.browserless.svc.cluster.local:3000"
            - name: VOX_URL
              value: "http://vox-service.vox.svc.cluster.local:11435"
            - name: VOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: VOX_API_KEY
            - name: VOX_STT_MODEL
              value: "parakeet-stt:tdt-0.6b-v3"
            - name: VOX_TTS_MODEL
              value: "kokoro-tts:v1.0"
            - name: VOX_VOICE
              value: "af_heart"
            - name: ROLEPLAY_DEFAULT_VOICE
              value: "af_heart"
            - name: VOX_TURN_PROFILE
              value: "browser_default"
            - name: VOX_VAD_BACKEND
              value: "silero"
            - name: VOX_TURN_DETECTOR
              value: "livekit"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: readable-v4-data-20261030
