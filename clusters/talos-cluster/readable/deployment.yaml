apiVersion: apps/v1
kind: Deployment
metadata:
  name: readable
  namespace: readable
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: readable
  template:
    metadata:
      labels:
        app: readable
    spec:
      imagePullSecrets:
        - name: zot-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: readable
          image: zot.maix.ovh/readable:v0.0.97@sha256:64ea234e37f06ff5d217239985000f0a51ab266f6a66ffa1312816a8978c6c70
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GOLEM_HTTP_ADDRESS
              value: ":8080"
            - name: GOLEM_DATABASE_DSN
              value: "file:/data/readable.sqlite"
            - name: GOLEM_SQLITE_DURABILITY
              value: "network-filesystem-wal"
            - name: READABLE_SETTINGS_KEY_FILE
              value: "/run/secrets/readable/settings.key"
            - name: STORAGE_DIR
              value: "/data/storage"
            - name: AUTH_COOKIE_SECURE
              value: "true"
            - name: TRUSTED_ORIGINS
              value: "https://readable.maix.ovh"
            - name: AUTHENTIK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_ISSUER
            - name: AUTHENTIK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_CLIENT_ID
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_CLIENT_SECRET
            - name: AUTHENTIK_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_REDIRECT_URL
            - name: AUTHENTIK_POST_LOGOUT_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_POST_LOGOUT_REDIRECT_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: settings-key
              mountPath: /run/secrets/readable
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: readable-data-20261107-db-settings
        - name: settings-key
          secret:
            secretName: readable-secret
            items:
              - key: READABLE_SETTINGS_KEY
                path: settings.key
            defaultMode: 0440
