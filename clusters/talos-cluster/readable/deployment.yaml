apiVersion: apps/v1
kind: Deployment
metadata:
  name: readable
  namespace: readable
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: readable
  template:
    metadata:
      labels:
        app: readable
    spec:
      imagePullSecrets:
        - name: zot-pull-secret
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: readable
          image: zot.maix.ovh/readable:v0.0.47@sha256:75cdee86f220943189a722d8ed9ee3b3b695e559088bb8cac74f5f35474540c2
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: readable-v4-config
          env:
            - name: AUTHENTIK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_ISSUER
            - name: AUTHENTIK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_CLIENT_ID
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_CLIENT_SECRET
            - name: AUTHENTIK_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_REDIRECT_URL
            - name: AUTHENTIK_POST_LOGOUT_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: AUTHENTIK_POST_LOGOUT_REDIRECT_URL
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: LITELLM_API_KEY
            - name: VOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: VOX_API_KEY
            - name: MIMIR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: readable-secret
                  key: MIMIR_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: readable-v4-data
