apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readable-data
  namespace: readable
spec:
  storageClassName: app-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readable-v4-data
  namespace: readable
spec:
  storageClassName: app-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
