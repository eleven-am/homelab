apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: durable-streams-secret
  namespace: durable-streams
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /durable-streams
  targets:
    - name: durable-streams-secret
      namespace: durable-streams
      kind: Secret
      creationPolicy: Owner
