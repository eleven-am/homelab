apiVersion: v1
kind: ConfigMap
metadata:
  name: webdav-config
  namespace: samba
data:
  config.yml: |
    address: 0.0.0.0
    port: 8080
    tls: false
    prefix: /
    behindProxy: true
    directory: /data
    permissions: CRUD
    log:
      format: console
      colors: false
      outputs:
        - stderr
    users:
      - username: royossai
        password: "{env}WEBDAV_PASSWORD"
