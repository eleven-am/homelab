apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: samba-secret
  namespace: samba
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /samba
  targets:
    - name: samba-secret
      namespace: samba
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          password: "{{ .PASSWORD.Value }}"
          config.yml: "{{ .CONFIG_YML.Value }}"
