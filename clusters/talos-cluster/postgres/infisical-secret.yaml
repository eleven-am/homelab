apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: postgres-secret
  namespace: postgres
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "litellm,nabu,usesend"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "litellm,nabu,usesend"
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /postgres
  targets:
    - name: postgres-secret
      namespace: postgres
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          POSTGRES_USER: "{{ .POSTGRES_USER.Value }}"
          POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD.Value }}"
          POSTGRES_DB: "{{ .POSTGRES_DB.Value }}"
          ELECTRIC_SECRET: "{{ .ELECTRIC_SECRET.Value }}"
          userlist.txt: "{{ .USERLIST_TXT.Value }}"
