apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: pad-secrets
  namespace: pad
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /pad
  targets:
    - name: pad-secrets
      namespace: pad
      kind: Secret
      creationPolicy: Owner
