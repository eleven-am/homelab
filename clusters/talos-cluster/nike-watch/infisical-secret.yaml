apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: nike-watch-secret
  namespace: nike-watch
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /nike-watch
  targets:
    - name: nike-watch-secret
      namespace: nike-watch
      kind: Secret
      creationPolicy: Owner
