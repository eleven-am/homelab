apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cleanuparr-route
  namespace: cleanuparr
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
  hostnames:
    - "cleanuparr.horus.maix.ovh"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cleanuparr
          port: 80
