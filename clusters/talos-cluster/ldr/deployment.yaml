apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldr
  namespace: ldr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ldr
  template:
    metadata:
      labels:
        app: ldr
    spec:
      containers:
        - name: ldr
          image: localdeepresearch/local-deep-research:1.10.7@sha256:ce95481a35d3eebc2c1ae7bd34fad426108c3fb8d1a22f66c9e772276869c2f0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "3Gi"
              cpu: "2"
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: LDR_WEB_HOST
              value: "0.0.0.0"
            - name: LDR_WEB_PORT
              value: "5000"
            - name: LDR_DATA_DIR
              value: "/data"
            - name: LDR_APP_ALLOW_REGISTRATIONS
              value: "false"
            - name: LDR_LLM_PROVIDER
              value: "openai_endpoint"
            - name: LDR_LLM_OPENAI_ENDPOINT_URL
              value: "http://litellm-service.litellm.svc.cluster.local:4000/v1"
            - name: LDR_LLM_OPENAI_ENDPOINT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ldr-secrets
                  key: LITELLM_API_KEY
            - name: LDR_LLM_MODEL
              value: "osiris/foundation-pro"
            - name: LDR_SEARCH_TOOL
              value: "searxng"
            - name: LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_INSTANCE_URL
              value: "http://vor.vor.svc.cluster.local"
            - name: LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_RESULT_FORMAT
              value: "json"
          volumeMounts:
            - name: ldr-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: ldr-data
          persistentVolumeClaim:
            claimName: ldr-data
