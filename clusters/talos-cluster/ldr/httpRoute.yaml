apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ldr-route
  namespace: ldr
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
  hostnames:
    - "ldr.horus.maix.ovh"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: ldr
          port: 80
