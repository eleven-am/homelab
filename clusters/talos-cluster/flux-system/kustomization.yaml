apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - sops-decrypt.yaml
  # Gateway API and Envoy Gateway CRDs, rendered from the upstream CRD chart.
  # Regenerate with the version pinned in envoy-gateway/release.yaml:
  #   helm template eg oci://docker.io/envoyproxy/gateway-crds-helm --version <v> \
  #     --set crds.gatewayAPI.enabled=true --set crds.gatewayAPI.channel=experimental \
  #     --set crds.envoyGateway.enabled=true
  # Vendored rather than installed by Helm: a release secret cannot hold CRDs
  # this large, which is why upstream documents template-and-apply instead.
  - gateway-api
  - envoy-gateway-crds
  - cilium-policy.yaml
  - cilium-pool.yaml
patches:
  - patch: |
      - op: add
        path: /spec/decryption
        value:
          provider: sops
          secretRef:
            name: sops-age
    target:
      kind: Kustomization
      name: flux-system
