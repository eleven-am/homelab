apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: camille-horus-route
  namespace: launchpad
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
  hostnames:
    - "camille.horus.maix.ovh"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: launchpad
          port: 80
