apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: launchpad-secrets
  namespace: launchpad
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /launchpad
  targets:
    - name: launchpad-secrets
      namespace: launchpad
      kind: Secret
      creationPolicy: Owner
