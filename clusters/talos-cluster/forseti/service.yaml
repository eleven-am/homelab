apiVersion: v1
kind: Service
metadata:
  name: forseti
  namespace: forseti
  labels:
    app.kubernetes.io/name: forseti
spec:
  selector:
    app.kubernetes.io/name: forseti
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
    - name: realtime
      port: 3001
      targetPort: realtime
      protocol: TCP
