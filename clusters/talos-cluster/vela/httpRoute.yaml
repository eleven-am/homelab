apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vela-horus-route
  namespace: vela
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
  hostnames:
    - "vela.horus.maix.ovh"
  rules:
    - timeouts:
        request: "120s"
        backendRequest: "120s"
      matches:
        - path:
            type: PathPrefix
            value: /
        - path:
            type: PathPrefix
            value: /api/vox/rtc
      backendRefs:
        - name: vela
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vela-horus-api-route
  namespace: vela
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
  hostnames:
    - "vela.horus.maix.ovh"
  rules:
    - timeouts:
        request: "120s"
        backendRequest: "120s"
      matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Auth-User
              - X-Auth-Email
              - X-Auth-Sub
      backendRefs:
        - name: vela
          port: 8080
