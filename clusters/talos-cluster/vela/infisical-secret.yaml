apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: vela-secret
  namespace: vela
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /vela
  targets:
    - name: vela-secret
      namespace: vela
      kind: Secret
      creationPolicy: Owner
