apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: nabu-secret
  namespace: nabu
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /nabu
  targets:
    - name: nabu-secret
      namespace: nabu
      kind: Secret
      creationPolicy: Owner
