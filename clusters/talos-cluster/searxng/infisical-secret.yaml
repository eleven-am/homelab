apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: searxng-secret
  namespace: searxng
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /searxng
  targets:
    - name: searxng-secret
      namespace: searxng
      kind: Secret
      creationPolicy: Owner
