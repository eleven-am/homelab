apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings:
      engines:
        keep_only:
          - google cse
          - bing
          - startpage
          - duckduckgo via flaresolverr
          - ecosia via flaresolverr
          - yandex
          - qwant
          - brave
          - presearch
          - swisscows
          - marginalia
          - mwmbl
          - wikipedia
          - github
          - github code
          - stackoverflow
          - reddit
          - hackernews
          - arxiv
          - semantic scholar
          - mdn
          - arch linux wiki
          - docker hub
          - lib.rs
          - pkg.go.dev

    general:
      instance_name: "SearXNG"
      privacypolicy_url: false
      donation_url: false
      contact_url: false
      enable_metrics: false

    search:
      safe_search: 0
      autocomplete: ""
      default_lang: "en"
      ban_time_on_fail: 30
      max_ban_time_on_fail: 600
      formats:
        - html
        - json

    server:
      secret_key: "overridden-by-searxng-secret"
      limiter: false
      image_proxy: true
      http_protocol_version: "1.1"
      method: "GET"

    ui:
      static_use_hash: true
      default_theme: simple
      results_on_new_tab: false

    outgoing:
      request_timeout: 6.0
      max_request_timeout: 75.0
      useragent_suffix: ""
      pool_connections: 100
      pool_maxsize: 50
      enable_http2: true

    engines:
      - name: google cse
        disabled: false
      - name: bing
        disabled: false
      - name: startpage
        disabled: false
      - name: duckduckgo via flaresolverr
        engine: json_engine
        shortcut: ddg
        categories: [general, web]
        paging: false
        search_url: http://searxng-flaresolverr-adapter.searxng.svc.cluster.local:8081/duckduckgo?q={query}
        enable_http: true
        results_query: results
        url_query: url
        title_query: title
        content_query: content
        timeout: 60
        disabled: false
      - name: ecosia via flaresolverr
        engine: json_engine
        shortcut: eco
        categories: [ecosia]
        paging: false
        search_url: http://searxng-flaresolverr-adapter.searxng.svc.cluster.local:8081/ecosia?q={query}
        enable_http: true
        results_query: results
        url_query: url
        title_query: title
        content_query: content
        timeout: 60
        disabled: false
      - name: yandex
        disabled: false
        categories: [candidate]
      - name: qwant
        disabled: false
        categories: [candidate]
      - name: brave
        disabled: false
        inactive: false
        categories: [candidate]
      - name: presearch
        disabled: false
        categories: [candidate]
      - name: swisscows
        disabled: false
        inactive: false
        categories: [candidate]
      - name: marginalia
        disabled: false
        inactive: false
        categories: [candidate]
      - name: mwmbl
        disabled: false
        categories: [candidate]
      - name: wikipedia
        disabled: false
      - name: arxiv
        disabled: false
      - name: github
        disabled: false
      - name: github code
        disabled: false
        inactive: false
      - name: stackoverflow
        disabled: false
      - name: reddit
        disabled: false
      - name: hackernews
        disabled: false
      - name: semantic scholar
        disabled: false
        inactive: false
      - name: mdn
        disabled: false
      - name: arch linux wiki
        disabled: false
      - name: docker hub
        disabled: false
      - name: lib.rs
        disabled: false
      - name: pkg.go.dev
        disabled: false
