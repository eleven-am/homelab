apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng-flaresolverr-adapter
  namespace: searxng
  labels:
    app: searxng-flaresolverr-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng-flaresolverr-adapter
  template:
    metadata:
      labels:
        app: searxng-flaresolverr-adapter
    spec:
      containers:
        - name: adapter
          image: python:3.14.8-alpine3.24@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/adapter.py"]
          ports:
            - containerPort: 8081
          env:
            - name: FLARESOLVERR_URL
              value: "http://prowlarr-service.prowlarr.svc.cluster.local:8191/v1"
            - name: FLARESOLVERR_TIMEOUT_MS
              value: "45000"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: adapter
              mountPath: /app/adapter.py
              subPath: adapter.py
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: adapter
          configMap:
            name: searxng-flaresolverr-adapter
