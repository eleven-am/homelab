apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: zot-github-oauth
  namespace: zot
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /zot/github-oauth
  targets:
    - name: zot-github-oauth
      namespace: zot
      kind: Secret
      creationPolicy: Owner
