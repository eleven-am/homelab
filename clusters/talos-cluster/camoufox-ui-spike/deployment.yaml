apiVersion: apps/v1
kind: Deployment
metadata:
  name: camoufox-ui-spike
  namespace: camoufox-ui-spike
  labels:
    app: camoufox-ui-spike
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: camoufox-ui-spike
  template:
    metadata:
      labels:
        app: camoufox-ui-spike
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: browser-ui
          image: zot.maix.ovh/mimir-browser-ui:v0.0.1@sha256:e981494161d3a32a2ebfa979d799d9923e29eeb3f621d7605ac69b2b807266b9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6080
          env:
            - name: BROWSER_UI_INITIAL_URL
              value: "https://example.com"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: shared-memory
              mountPath: /dev/shm
            - name: profile
              mountPath: /home/browser-ui/profile
            - name: runtime
              mountPath: /run/browser-ui
          startupProbe:
            exec:
              command:
                - /opt/camoufox-python/bin/python
                - /app/browser-ui/healthcheck.py
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /opt/camoufox-python/bin/python
                - /app/browser-ui/healthcheck.py
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /opt/camoufox-python/bin/python
                - /app/browser-ui/healthcheck.py
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: profile
          emptyDir: {}
        - name: runtime
          emptyDir: {}
      imagePullSecrets:
        - name: zot-pull-secret
