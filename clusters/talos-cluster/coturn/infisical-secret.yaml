apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: coturn-secret
  namespace: coturn
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /coturn
  targets:
    - name: coturn-secret
      namespace: coturn
      kind: Secret
      creationPolicy: Owner
