apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: litellm-secret
  namespace: litellm
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /litellm/app
  targets:
    - name: litellm-secret
      namespace: litellm
      kind: Secret
      creationPolicy: Owner
