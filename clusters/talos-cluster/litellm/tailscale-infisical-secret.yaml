apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: litellm-tailscale-secret
  namespace: litellm
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /litellm/tailscale
  targets:
    - name: litellm-tailscale-secret
      namespace: litellm
      kind: Secret
      creationPolicy: Owner
