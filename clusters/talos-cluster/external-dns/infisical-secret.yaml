apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: pihole-config
  namespace: external-dns
spec:
  infisicalAuthRef:
    name: homelab
    namespace: infisical
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /external-dns
  targets:
    - name: pihole-config
      namespace: external-dns
      kind: Secret
      creationPolicy: Owner
