apiVersion: apps/v1
kind: Deployment
metadata:
  name: metube
  namespace: metube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metube
  template:
    metadata:
      labels:
        app: metube
    spec:
      containers:
        - name: metube
          image: ghcr.io/alexta69/metube:2026.07.24@sha256:3b3b847a125e78037983d3a27c76212e2fc7a0c3a813591ec0de53613e0be874
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir -U yt-dlp || true
              exec /usr/bin/tini -g -- /app/docker-entrypoint.sh
          workingDir: /app
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DEFAULT_THEME
              value: "auto"
            - name: DELETE_FILE_ON_TRASHCAN
              value: "true"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            - name: downloads
              mountPath: /downloads
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: metube-downloads
