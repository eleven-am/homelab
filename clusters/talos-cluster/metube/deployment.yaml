apiVersion: apps/v1
kind: Deployment
metadata:
  name: metube
  namespace: metube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metube
  template:
    metadata:
      labels:
        app: metube
    spec:
      containers:
        - name: metube
          image: ghcr.io/alexta69/metube:2026.10.09@sha256:df929ef2453fd75c1f1cbd8dafb309ee03ff18d8705c7c1e01642b1202d4a650
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir --require-hashes -r /config/requirements.txt
              exec /usr/bin/tini -g -- /app/docker-entrypoint.sh
          workingDir: /app
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DEFAULT_THEME
              value: "auto"
            - name: DELETE_FILE_ON_TRASHCAN
              value: "true"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            - name: downloads
              mountPath: /downloads
            - name: ytdlp-requirements
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: metube-downloads
        - name: ytdlp-requirements
          configMap:
            name: metube-ytdlp-requirements
