apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 1h
  chart:
    spec:
      chart: gateway-helm
      version: "v1.9.0"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
  values:
    # CRDs are vendored in flux-system and applied by the kustomization, which
    # is upstream's documented approach for CRDs too large for a Helm release.
    crds:
      enabled: false
