apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
  namespace: envoy-gateway-system
spec:
  interval: 1h
  chart:
    spec:
      chart: gateway-crds-helm
      version: "v1.9.0"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
  values:
    crds:
      # Envoy Gateway's own API. The gateway-helm chart ships these in a crds
      # directory, which Helm writes on install and never revisits, so they had
      # drifted three minor versions behind the controller. This chart templates
      # them, so they now move with the version pinned above.
      envoyGateway:
        enabled: true
      # gateway-api CRDs stay with the flux kustomization, which is their sole
      # owner. Enabling them here would give two systems the same objects.
      gatewayAPI:
        enabled: false
